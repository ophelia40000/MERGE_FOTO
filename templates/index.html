<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo to PDF Converter</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="background"></div>
    <div class="container">
        <header>
            <h1>Photo to PDF</h1>
            <p>Upload 4 images to create a single-page PDF</p>
        </header>

        <form action="/convert" method="post" enctype="multipart/form-data" id="upload-form">
            <div class="upload-area" id="drop-zone">
                <div class="upload-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/>
                    </svg>
                </div>
                <span>Drag & drop or <label for="file-input">browse</label></span>
                <input type="file" id="file-input" name="photos" multiple accept="image/*" hidden>
            </div>

            <div id="preview-grid" class="preview-grid"></div>

            <button type="submit" id="submit-btn" class="btn hidden">
                Generate PDF
            </button>
        </form>
    </div>

    <script>
        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('file-input');
        const previewGrid = document.getElementById('preview-grid');
        const submitBtn = document.getElementById('submit-btn');

        ['dragover', 'dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, e => {
                e.preventDefault();
                e.stopPropagation();
            });
        });

        dropZone.addEventListener('dragover', () => dropZone.classList.add('active'));
        dropZone.addEventListener('dragleave', () => dropZone.classList.remove('active'));
        
        dropZone.addEventListener('click', () => fileInput.click());

        dropZone.addEventListener('drop', e => {
            dropZone.classList.remove('active');
            const files = e.dataTransfer.files;
            
            // Sync dropped files to the hidden input
            const dataTransfer = new DataTransfer();
            Array.from(files).forEach(file => dataTransfer.items.add(file));
            fileInput.files = dataTransfer.files;
            
            handleFiles(files);
        });

        fileInput.addEventListener('change', e => {
            handleFiles(e.target.files);
        });

        let objectUrls = [];

        function handleFiles(files) {
            if (!files || files.length === 0) return;
            
            // Clean up old object URLs to prevent memory leaks
            objectUrls.forEach(url => URL.revokeObjectURL(url));
            objectUrls = [];
            
            previewGrid.innerHTML = '';
            const fileList = Array.from(files);
            
            if (fileList.length > 0) {
                submitBtn.classList.remove('hidden');
            } else {
                submitBtn.classList.add('hidden');
            }

            fileList.forEach(file => {
                try {
                    const url = URL.createObjectURL(file);
                    objectUrls.push(url);
                    
                    const div = document.createElement('div');
                    div.className = 'preview-item';
                    
                    const img = document.createElement('img');
                    img.src = url;
                    img.alt = 'preview';
                    img.onload = () => {
                        // Image loaded successfully
                        console.log('Image loaded');
                    };
                    img.onerror = () => {
                        console.error('Failed to load image preview');
                        div.innerHTML = '<span style="color: #ef4444; font-size: 0.8rem;">Error loading image</span>';
                    };
                    
                    div.appendChild(img);
                    previewGrid.appendChild(div);
                } catch (err) {
                    console.error('Error creating object URL:', err);
                }
            });
        }
    </script>
</body>
</html>
